<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>The Cloud Workshop Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', 'Orbitron', sans-serif;
    }

    body {
      height: 100vh;
      background: url("cloud-workshop-studio-logo.jpg") no-repeat center center fixed;
      background-size: cover;
      background-color: #0f172a;
      color: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    /* --- NAVIGATION --- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    .btn-yt {
      padding: 10px 18px;
      background: #ff7b00;
      color: #0b0c10;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 0 18px rgba(255, 123, 0, 0.6);
      transition: transform 0.2s ease;
    }

    .btn-yt:hover {
      transform: translateY(-3px);
    }

    /* --- HERO CONTENT --- */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 720px;
      margin: 0 auto;
      margin-top: 22vh;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #ff7b00;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    a.btn {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      color: #0b0c10;
      background: linear-gradient(135deg, #ff7b00, #ffbf3c);
      box-shadow: 0 0 20px rgba(255, 123, 0, 0.6);
      transition: transform 0.2s ease;
    }

    a.btn:hover {
      transform: translateY(-3px);
    }

    /* --- MOBILE --- */
    @media (max-width: 900px) {
      header {
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }

      .nav-links {
        gap: 20px;
      }

      .content {
        margin-top: 28vh;
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <!-- NAVIGATION -->
  <header>
    <nav>
      <ul class="nav-links">
        <li><a href="https://thecloudworkshop.uk/">Home</a></li>
        <li><a href="https://thecloudworkshop.uk/about/">About</a></li>
        <li><a href="https://thecloudworkshop.uk/services/">Services</a></li>
        <li><a href="https://thecloudworkshop.uk/blog/">Blog</a></li>
      </ul>
    </nav>

    <a href="https://www.youtube.com/@thecloudworkshop" class="btn-yt">🎬 YouTube</a>
  </header>

  <!-- HERO -->
  <main class="content">
    <h1>The Cloud Workshop Studio</h1>
    <p>Where cloud technology meets creativity and community.</p>
    <a href="https://thecloudworkshop.uk" class="btn">Enter Studio</a>
  </main>

</body>
</html>
