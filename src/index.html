<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Cloud Workshop Studio – Community Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #050814;
      --bg-alt: #0b1020;
      --accent: #4cc9f0;
      --accent-soft: rgba(76, 201, 240, 0.15);
      --accent-strong: #f72585;
      --text: #f5f7ff;
      --muted: #a9b0d9;
      --card: #11172b;
      --border: #1f2740;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.45);
      --max-width: 1120px;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: radial-gradient(circle at top, #1b2340 0, #050814 55%, #02030a 100%);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #4cc9f0, #7209b7 45%, #050814 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .logo-text {
      font-weight: 600;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    nav {
      display: flex;
      gap: 18px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    nav a {
      padding: 6px 10px;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }

    nav a:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 32px;
      align-items: center;
      margin-bottom: 40px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12, 19, 40, 0.9);
      border: 1px solid rgba(76, 201, 240, 0.35);
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .hero-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(76, 201, 240, 0.8);
    }

    .hero h1 {
      font-size: clamp(2.4rem, 3vw, 3rem);
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero-sub {
      font-size: 0.98rem;
      color: var(--muted);
      max-width: 520px;
      margin-bottom: 22px;
    }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4cc9f0, #4361ee);
      border-color: rgba(255, 255, 255, 0.12);
      color: #050814;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(67, 97, 238, 0.45);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 40px rgba(67, 97, 238, 0.6);
    }

    .btn-secondary {
      background: rgba(10, 16, 32, 0.9);
      border-color: rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    .btn-secondary:hover {
      background: rgba(18, 26, 50, 0.95);
      color: var(--text);
    }

    .hero-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hero-visual {
      position: relative;
      padding: 18px;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at top, #1b2340 0, #050814 60%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .hero-cloud {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(76, 201, 240, 0.25), transparent 55%),
        radial-gradient(circle at 80% 20%, rgba(247, 37, 133, 0.25), transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    .hero-panel {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .hero-panel-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .hero-panel-main {
      font-size: 1.05rem;
      font-weight: 500;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .tag {
      font-size: 0.75rem;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(9, 14, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .tag-accent {
      border-color: rgba(76, 201, 240, 0.6);
      color: var(--accent);
      background: rgba(6, 18, 30, 0.9);
    }

    .pillars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .pillars-card {
      background: var(--bg-alt);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 14px 14px 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .pillars-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .pillars-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .pillars-text {
      font-size: 0.85rem;
      color: var(--muted);
    }

    section {
      margin-bottom: 40px;
    }

    .section-header {
      margin-bottom: 18px;
    }

    .section-kicker {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .section-sub {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 520px;
    }

    .mission-card {
      background: var(--bg-alt);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 18px 18px 20px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .mission-glow {
      position: absolute;
      inset: 0;
